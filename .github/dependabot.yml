version: 2
updates:
  # Keep the SHA-pinned GitHub Actions in .github/workflows current — Dependabot
  # bumps both the pin and the version comment when a new release lands.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  # Go modules (backend).
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  # npm (frontend).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      frontend:
        patterns: ["*"]
