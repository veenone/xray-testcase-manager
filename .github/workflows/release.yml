name: Release

# Tag a release to build and publish Windows + macOS artifacts:
#   git tag v0.2.0 && git push origin v0.2.0
# The two jobs upload to the same GitHub Release for the tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (x.y.z), no leading v"
        required: true

permissions:
  contents: write

# Run JavaScript actions on Node 24 — Node 20 is deprecated on GitHub runners.
# Covers any action still shipping a Node 20 entrypoint (e.g. the third-party
# release action) in addition to the version bumps below.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install Inno Setup (for the installer)
        run: choco install innosetup -y --no-progress

      - name: Resolve version
        id: ver
        shell: pwsh
        run: |
          $v = if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            "${{ github.event.inputs.version }}"
          } else {
            "${{ github.ref_name }}".TrimStart("v")
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $v"

      - name: Build & bundle
        shell: pwsh
        run: ./scripts/release.ps1 -Version ${{ steps.ver.outputs.version }}

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Xray Test Manager v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: xray-test-manager-${{ steps.ver.outputs.version }}
          path: dist/*

  release-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.25"

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "20"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            v="${{ github.event.inputs.version }}"
          else
            v="${GITHUB_REF_NAME#v}"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building version $v"

      - name: Build universal .app
        run: wails build -platform darwin/universal -clean

      # --- Code signing + notarization (optional) ---
      # All steps below are skipped unless the signing secrets are configured, so
      # the workflow still publishes an (unsigned) .app out of the box. To enable,
      # set repo secrets: MACOS_CERTIFICATE_P12 (base64 of a "Developer ID
      # Application" .p12), MACOS_CERTIFICATE_PASSWORD, MACOS_SIGNING_IDENTITY,
      # and for notarization MACOS_NOTARY_APPLE_ID / _TEAM_ID / _PASSWORD
      # (an app-specific password).
      - name: Check signing secrets
        id: sign
        run: |
          if [ -n "${{ secrets.MACOS_CERTIFICATE_P12 }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::macOS signing secrets not set — publishing an unsigned .app"
          fi
          if [ -n "${{ secrets.MACOS_NOTARY_PASSWORD }}" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        if: steps.sign.outputs.enabled == 'true'
        env:
          CERT_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERT_PW: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          kpw="$(openssl rand -base64 24)"
          security create-keychain -p "$kpw" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$kpw" "$keychain"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kpw" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Codesign .app
        if: steps.sign.outputs.enabled == 'true'
        working-directory: build/bin
        run: |
          codesign --force --deep --options runtime --timestamp \
            --sign "${{ secrets.MACOS_SIGNING_IDENTITY }}" "xray-test-manager.app"
          codesign --verify --strict --verbose=2 "xray-test-manager.app"

      - name: Notarize + staple
        if: steps.sign.outputs.enabled == 'true' && steps.sign.outputs.notarize == 'true'
        working-directory: build/bin
        run: |
          ditto -c -k --keepParent "xray-test-manager.app" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "${{ secrets.MACOS_NOTARY_APPLE_ID }}" \
            --team-id "${{ secrets.MACOS_NOTARY_TEAM_ID }}" \
            --password "${{ secrets.MACOS_NOTARY_PASSWORD }}" --wait
          xcrun stapler staple "xray-test-manager.app"

      - name: Package .app (zip + checksum)
        working-directory: build/bin
        run: |
          app="xray-test-manager.app"
          out="xray-test-manager-${{ steps.ver.outputs.version }}-macos-universal.zip"
          # ditto preserves the bundle structure and resource forks for a valid .app zip.
          ditto -c -k --sequesterRsrc --keepParent "$app" "$out"
          shasum -a 256 "$out" > "SHA256SUMS-macos.txt"
          ls -la

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Xray Test Manager v${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            build/bin/*.zip
            build/bin/SHA256SUMS-macos.txt

      - name: Upload artifacts (manual runs)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: xray-test-manager-macos-${{ steps.ver.outputs.version }}
          path: build/bin/*.zip
