name: Build check

# Early signal on PRs and main: run the Go tests and confirm the desktop app
# builds on both Windows and macOS (the release workflow only runs on tags).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - name: Go tests
        # Scope to internal/ — the main package embeds frontend/dist, which
        # isn't built in this job; all tests live under internal/ anyway.
        working-directory: xtm
        run: go test ./internal/...
      - name: Go tests (core)
        working-directory: core
        run: go test ./...
      - name: Go tests (tam)
        working-directory: tam
        run: go test ./internal/...

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Vitest (every workspace)
        run: npm test --workspaces --if-present
      - name: Type check (every workspace)
        run: npm run typecheck --workspaces --if-present

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      # Pinned to match go.mod. The Wails CLI rewrites go.mod to its own
      # version on every invocation, so @latest silently changes the module
      # requirement and the released binary's Wails version drifts with it.
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build (.exe)
        working-directory: xtm
        run: wails build
      - name: Build TAM (.exe)
        working-directory: tam
        run: wails build

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"
      # Pinned to match go.mod. The Wails CLI rewrites go.mod to its own
      # version on every invocation, so @latest silently changes the module
      # requirement and the released binary's Wails version drifts with it.
      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
      - name: Build universal .app
        working-directory: xtm
        run: wails build -platform darwin/universal
      - name: Build TAM universal .app
        working-directory: tam
        run: wails build -platform darwin/universal
