<svg xmlns="http://www.w3.org/2000/svg" width="780" height="596" viewBox="0 0 780 596" role="img" aria-label="Mockup of the bulk rename summaries modal">
  <title>Bulk rename summaries modal</title>
  <desc>Modal with a prefix, suffix or both mode selector, a prefix input, a counts line, and a live before-and-after preview of the selected tests.</desc>

  <defs>
    <style>
      .t     { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
      .mono  { font-family: "Cascadia Mono", Consolas, ui-monospace, monospace; }
      .title { font-size: 16px; font-weight: 600; fill: #1f2933; }
      .lbl   { font-size: 12px; fill: #6b7280; }
      .body  { font-size: 13px; fill: #1f2933; }
      .muted { font-size: 13px; fill: #6b7280; }
      .small { font-size: 12px; fill: #6b7280; }
      .warn  { font-size: 13px; fill: #925b0a; }
      .warns { font-size: 12px; fill: #925b0a; }
      .btnpr { font-size: 13px; font-weight: 600; fill: #ffffff; }
      .btnsc { font-size: 13px; fill: #1f2933; }
    </style>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0b1220" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- page behind the dialog -->
  <rect width="780" height="596" fill="#eef0f3"/>

  <!-- dialog -->
  <rect x="20" y="20" width="740" height="556" rx="10" fill="#ffffff" stroke="#dfe1e6" filter="url(#cardShadow)"/>

  <!-- header -->
  <text class="t title" x="44" y="56">Rename summaries</text>
  <text class="t" x="726" y="56" font-size="15" fill="#6b7280" text-anchor="end">✕</text>
  <line x1="20" y1="74" x2="760" y2="74" stroke="#eceef1"/>

  <!-- mode selector: a radio group, so all three options are visible at once -->
  <text class="t lbl" x="44" y="108">What to add</text>

  <circle cx="140" cy="103" r="6.5" fill="#ffffff" stroke="#3b5bdb" stroke-width="2"/>
  <circle cx="140" cy="103" r="3" fill="#3b5bdb"/>
  <text class="t body" x="154" y="108">Prefix</text>

  <circle cx="224" cy="103" r="6.5" fill="#ffffff" stroke="#c4c9d4"/>
  <text class="t body" x="238" y="108">Suffix</text>

  <circle cx="306" cy="103" r="6.5" fill="#ffffff" stroke="#c4c9d4"/>
  <text class="t body" x="320" y="108">Both</text>

  <!-- affix input -->
  <text class="t lbl" x="44" y="146">Prefix</text>
  <rect x="110" y="128" width="380" height="32" rx="6" fill="#ffffff" stroke="#3b5bdb"/>
  <text class="t mono" x="122" y="149" font-size="13" fill="#1f2933">[SMOKE]&#160;</text>
  <rect x="184" y="136" width="1.5" height="16" fill="#1f2933"/>

  <!-- counts, rendered into an aria-live region in the real modal -->
  <text class="t body" x="44" y="192" font-weight="600">184 will change,</text>
  <text class="t muted" x="164" y="192">12 unchanged, 4 too long</text>

  <line x1="44" y1="206" x2="736" y2="206" stroke="#eceef1"/>

  <!-- preview rows -->
  <text class="t mono small" x="44" y="232">QA-1042</text>
  <text class="t muted" x="128" y="232">Login with valid credentials</text>
  <text class="t muted" x="330" y="232">→</text>
  <rect x="348" y="220" width="62" height="17" rx="3" fill="rgba(59,91,219,0.13)"/>
  <text class="t mono" x="352" y="232" font-size="12" fill="#3b5bdb">[SMOKE]</text>
  <text class="t body" x="414" y="232">Login with valid credentials</text>

  <text class="t mono small" x="44" y="264">QA-1043</text>
  <text class="t muted" x="128" y="264">Logout clears the session</text>
  <text class="t muted" x="330" y="264">→</text>
  <rect x="348" y="252" width="62" height="17" rx="3" fill="rgba(59,91,219,0.13)"/>
  <text class="t mono" x="352" y="264" font-size="12" fill="#3b5bdb">[SMOKE]</text>
  <text class="t body" x="414" y="264">Logout clears the session</text>

  <!-- an already-prefixed row: shown, but excluded from the apply -->
  <rect x="36" y="278" width="708" height="30" rx="4" fill="#f6f7f9"/>
  <text class="t mono small" x="44" y="297">QA-1044</text>
  <text class="t muted" x="128" y="297">[SMOKE] Password reset by email</text>
  <text class="t small" x="392" y="297" fill="#6b7280">· already has this prefix</text>

  <!-- an over-length row: flagged and dropped -->
  <text class="t mono small" x="44" y="329">QA-1045</text>
  <text class="t muted" x="128" y="329">Card personalisation end to end …</text>
  <text class="t muted" x="330" y="329">→</text>
  <text class="t warn" x="348" y="329">[SMOKE] Card personalisation …</text>
  <text class="t warns" x="560" y="329">· over 255 characters</text>

  <text class="t mono small" x="44" y="361">QA-1046</text>
  <text class="t muted" x="128" y="361">Session times out after 15 min</text>
  <text class="t muted" x="330" y="361">→</text>
  <rect x="348" y="349" width="62" height="17" rx="3" fill="rgba(59,91,219,0.13)"/>
  <text class="t mono" x="352" y="361" font-size="12" fill="#3b5bdb">[SMOKE]</text>
  <text class="t body" x="414" y="361">Session times out after 15 min</text>

  <line x1="44" y1="378" x2="736" y2="378" stroke="#eceef1"/>
  <text class="t small" x="44" y="398">Showing 200 of 512.</text>

  <!-- explanatory notes, only shown when the counts are non-zero -->
  <text class="t small" x="44" y="428">12 tests already have this. They stay as they are.</text>
  <rect x="44" y="440" width="692" height="30" rx="5" fill="rgba(202,138,4,0.12)" stroke="#e4b761"/>
  <text class="t warns" x="56" y="459">4 tests would go over Jira's 255 character limit. They are left out.</text>

  <!-- footer -->
  <line x1="20" y1="500" x2="760" y2="500" stroke="#eceef1"/>
  <rect x="530" y="518" width="82" height="34" rx="6" fill="#ffffff" stroke="#dfe1e6"/>
  <text class="t btnsc" x="571" y="540" text-anchor="middle">Cancel</text>
  <rect x="622" y="518" width="114" height="34" rx="6" fill="#3b5bdb"/>
  <text class="t btnpr" x="679" y="540" text-anchor="middle">Rename 184 tests</text>
</svg>
